[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "curve_it"
version = "0.1.0"
description = "Terminal charts for RSL-RL training logs"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
png = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
curve_it = "curve_it.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
